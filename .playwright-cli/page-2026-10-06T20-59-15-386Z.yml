          - generic [ref=e2600]:
            - article [ref=e2601]:
              - heading "Toolbar controls" [level=4] [ref=e2602]
              - paragraph [ref=e2603]: Keep Book / Original PDF and Page flip / Scroll as mutually exclusive segmented controls with a programmatic selected state. Zoom buttons remain separate and labeled. Bookmark toggle exposes “Add bookmark” / “Remove bookmark.”
            - article [ref=e2604]:
              - heading "Menus and popovers" [level=4] [ref=e2605]
              - paragraph [ref=e2606]: Open beside their trigger, align to the control group, fit within the viewport, and close on Escape or outside click. Keep focus inside modal dialogs; restore it to the invoking control on close.
            - article [ref=e2607]:
              - heading "Contents navigation" [level=4] [ref=e2608]
              - paragraph [ref=e2609]: Chapters are links with a visible current location, human-readable title, and page number. On mobile, open in a drawer with an explicit close action, Escape support, and a scrim that does not obscure the title.
            - article [ref=e2610]:
